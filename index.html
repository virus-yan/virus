<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>刷题软件 · 本地题库练习</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f8cff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="刷题">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<style>
:root{
  --bg:#0d1017;--bg2:#131822;--card:#181e29;--card2:#1e2531;--line:#28303e;
  --fg:#e8ecf3;--fg2:#93a0b4;--accent:#4f8cff;--accent-soft:rgba(79,140,255,.14);
  --ok:#22c55e;--ok-soft:rgba(34,197,94,.14);--bad:#ef4444;--bad-soft:rgba(239,68,68,.14);
  --warn:#f5a524;--shadow:0 10px 30px rgba(0,0,0,.35);--r:14px;
}
html[data-theme="light"]{
  --bg:#f4f6fa;--bg2:#eaeef5;--card:#ffffff;--card2:#f7f9fc;--line:#e2e7ef;
  --fg:#141a24;--fg2:#5d6b80;--accent:#2563eb;--accent-soft:rgba(37,99,235,.10);
  --ok:#15a34a;--ok-soft:rgba(21,163,74,.12);--bad:#dc2626;--bad-soft:rgba(220,38,38,.10);
  --warn:#d97706;--shadow:0 8px 24px rgba(20,30,50,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-size:15px;line-height:1.7;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--accent)}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.logo .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#22d3ee)}
.spacer{flex:1}
select,input[type=text],input[type=number],textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;max-width:1040px;margin:0 auto;padding:0 16px 10px}
.tab{padding:7px 14px;border-radius:999px;color:var(--fg2);font-size:14px;white-space:nowrap;transition:.15s}
.tab:hover{background:var(--card);color:var(--fg)}
.tab.on{background:var(--accent);color:#fff;font-weight:600}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card+.card{margin-top:14px}
.btn{padding:8px 16px;border-radius:10px;background:var(--card2);border:1px solid var(--line);transition:.15s;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{opacity:.9;color:#fff}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--fg2);font-size:13px}
.chip:hover{color:var(--fg)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--fg2)}
.small{font-size:13px}
.qstem{font-size:17px;font-weight:600;line-height:1.65;margin:0}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--card2);color:var(--fg2);border:1px solid var(--line)}
.tag.b{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tag.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.tag.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card2);transition:.13s;text-align:left;width:100%;font-size:15px;line-height:1.6}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--fg2)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.analysis{margin-top:16px;padding:14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:14px}
.analysis .hd{font-weight:700;color:var(--accent);margin-bottom:6px}
.bar{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#22d3ee);transition:width .25s}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g4{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.g2{grid-template-columns:1fr}}
.kv{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px}
.kv .v{font-size:23px;font-weight:700;line-height:1.35}
.kv .l{font-size:13px;color:var(--fg2)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:60;padding:16px;overflow:auto}
.overlay.on{display:block}
.modal{max-width:780px;margin:40px auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.cnum{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:13px;font-weight:600;color:var(--fg2);display:grid;place-items:center}
.cnum.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.cnum.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.cnum.done{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.cnum.cur{outline:2px solid var(--accent);outline-offset:1px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--line);padding:10px 18px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:99;pointer-events:none;font-size:14px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.kbd{font-family:ui-monospace,Consolas,monospace;font-size:12px;padding:1px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg2)}
textarea{width:100%;min-height:160px;resize:vertical;font-family:ui-monospace,Consolas,"Microsoft YaHei",monospace;font-size:13px;line-height:1.6}
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card2)}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.bars .b1{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b1 i{width:100%;background:linear-gradient(180deg,var(--accent),#22d3ee);border-radius:6px 6px 0 0;min-height:3px;display:block}
.hint{background:var(--accent-soft);border:1px dashed var(--accent);border-radius:12px;padding:12px 14px;font-size:14px}
.sticky-bar{position:sticky;top:96px;z-index:10}.fillwrap{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.fillrow{display:flex;align-items:center;gap:10px}
.fillrow input[type=text]{flex:1;min-width:120px;padding:10px 12px;border-radius:10px;font-size:15px}
.fillrow.ok input[type=text]{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.fillrow.bad input[type=text]{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.qarea{margin-top:16px}
.qarea textarea{min-height:140px;font-family:inherit;font-size:15px;line-height:1.7}
.selfjudge{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
code{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:13px}
pre.code{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:13px;line-height:1.6}
*{-webkit-tap-highlight-color:transparent}
button,.opt,.chip,.tab,select{touch-action:manipulation}
.top{padding-top:env(safe-area-inset-top)}
.wrap{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
@media(max-width:900px){
  .wrap{padding:12px 12px calc(90px + env(safe-area-inset-bottom))}
  .top-in{padding:8px 12px}
  .logo{font-size:16px}
  #scope{max-width:46vw;font-size:14px;padding:6px 8px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding:0 12px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:6px 12px;font-size:13px}
  .card{padding:14px;border-radius:12px}
  .qstem{font-size:16px}
  .opt{min-height:52px;padding:12px}
  .opt .k{flex:0 0 24px;height:24px}
  .btn{padding:9px 14px}
  .kv .v{font-size:20px}
  .fillrow input[type=text],.qarea textarea,input,select,textarea{font-size:16px !important}
  .onlydesk{display:none}
  .cards{grid-template-columns:repeat(auto-fill,minmax(42px,1fr))}
  .modal{margin:16px auto;padding:16px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="logo"><span class="dot"></span>刷题软件</div>
    <select id="scope" title="选择题库范围"></select>
    <div class="spacer"></div>
    <button class="btn sm" id="btnTheme">切换主题</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<div class="wrap" id="view"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>/* ==================== 基础工具 ==================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const LET = 'ABCDEFGHIJ'.split('');
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const qkey = (bankId, qid) => bankId + '::' + qid;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function sameSet(a, b) { if (!a || !b) return false; if (a.length !== b.length) return false; const x = a.map(v => String(v).toUpperCase()).sort(), y = b.map(v => String(v).toUpperCase()).sort(); return x.every((v, i) => v === y[i]); }
function fmtDur(sec) { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return (m ? m + ' 分 ' : '') + s + ' 秒'; }
function todayKey() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function pct(a, b) { return b > 0 ? Math.round(a / b * 100) : 0; }
const TYPE_NAME = { single: '单选', multiple: '多选', judge: '判断', fill: '填空', short: '简答' };
const narrowLatin = s => String(s == null ? '' : s)
  .replace(/[\u200B-\u200F\u2060\uFEFF\u00AD]/g, '')
  .replace(/[\uE000-\uF8FF]/g, ' ')
  .replace(/[\uFF21-\uFF3A\uFF41-\uFF5A\uFF10-\uFF19]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
/* 填空题答案书写规则：多个空用「；」或「||」分隔，同一个空的多种写法用「/」或「、」分隔 */
function splitBlanks(s) {
  const raw = String(s == null ? '' : s).trim();
  if (!raw) return [];
  let arr;
  if (raw.indexOf('||') >= 0) arr = raw.split('||');
  else if (raw.indexOf('；；') >= 0) arr = raw.split('；；');
  else if (raw.indexOf(';;') >= 0) arr = raw.split(';;');
  else if (raw.indexOf('；') >= 0) arr = raw.split('；');
  else arr = [raw];
  return arr.map(x => x.trim()).filter(x => x !== '');
}
function fillAlts(q, i) {
  return String((q.answer || [])[i] == null ? '' : (q.answer || [])[i]).split(/[\/|、]/).map(s => s.trim()).filter(Boolean);
}
function normText(s) {
  return String(s == null ? '' : s)
    .replace(/[\uFF01-\uFF5E]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/\s+/g, '')
    .replace(/[。．.，,、；;：:！!？?'"“”‘’（）()\[\]【】{}〈〉《》~～\-—_]/g, '')
    .toLowerCase();
}
function checkFill(q, inputs) {
  const n = Math.max(1, (q.answer || []).length);
  const out = [];
  for (let i = 0; i < n; i++) {
    const alts = fillAlts(q, i);
    const v = normText((inputs || [])[i]);
    out.push({ ok: v !== '' && alts.some(a => normText(a) === v), alts: alts, input: (inputs || [])[i] || '' });
  }
  return out;
}
function answerText(q) {
  if (!q) return '';
  if (q.type === 'fill') return (q.answer || []).map((s, i) => '第' + (i + 1) + '空：' + String(s).split('/').join(' / ')).join('　');
  if (q.type === 'short') return (q.answer || []).join(' ');
  return ansText(q, q.answer || []);
}
function userTextOf(q, chosen, inputs, text) {
  if (q.type === 'fill') { const a = inputs || []; return a.length ? a.map((v, i) => '第' + (i + 1) + '空：' + (String(v || '').trim() || '（未填）')).join('　') : '（未作答）'; }
  if (q.type === 'short') return String(text || '').trim() || '（未作答）';
  return ansText(q, chosen || []);
}

/* ==================== 内置示例题库 ==================== */
const BUILTIN = [
  { type: 'single', stem: '在计算机中，1 KB 等于多少字节？', options: ['1000', '1024', '512', '2048'], answer: 'B', analysis: '计算机采用二进制，1 KB = 2^10 = 1024 字节。1000 是十进制厂商标称值。' },
  { type: 'single', stem: '下列哪一项不属于操作系统？', options: ['Windows', 'Linux', 'MySQL', 'macOS'], answer: 'C', analysis: 'MySQL 是关系型数据库管理系统，其余三项都是操作系统。' },
  { type: 'single', stem: 'HTML 中用于创建超链接的标签是？', options: ['<a>', '<link>', '<href>', '<url>'], answer: 'A', analysis: '<a href="..."> 是超链接标签；<link> 用于引入外部资源（如 CSS）。' },
  { type: 'single', stem: 'IPv4 地址由多少位二进制数组成？', options: ['16 位', '32 位', '64 位', '128 位'], answer: 'B', analysis: 'IPv4 为 32 位，写成 4 段点分十进制；IPv6 为 128 位。' },
  { type: 'multiple', stem: '下列属于面向对象三大特性的是？', options: ['封装', '继承', '多态', '编译'], answer: 'ABC', analysis: '面向对象三大特性为封装、继承、多态；编译只是程序处理过程。' },
  { type: 'multiple', stem: '关于 HTTP 与 HTTPS，下列说法正确的有？', options: ['HTTPS 默认端口是 443', 'HTTP 数据以明文传输', 'HTTPS 需要数字证书', 'HTTPS 速度较慢，因此不安全'], answer: 'ABC', analysis: 'HTTPS = HTTP + TLS，端口 443，需要证书；速度略慢但更安全，D 的说法错误。' },
  { type: 'judge', stem: 'TCP 是面向连接的、可靠的传输层协议。', answer: '对', analysis: 'TCP 通过三次握手建立连接，具备确认重传、流量控制等机制；UDP 才是无连接不可靠的。' },
  { type: 'judge', stem: 'Python 是一种编译型语言。', answer: '错', analysis: 'Python 是解释型（先编译为字节码再由解释器执行）语言，通常不被整体编译为机器码。' },
  { type: 'single', stem: '十进制数 10 转换为二进制是？', options: ['1000', '1010', '1100', '1110'], answer: 'B', analysis: '10 = 8 + 2 = 2^3 + 2^1 = 1010(B)。' },
  { type: 'single', stem: '计算机中的“内存”通常指的是？', options: ['硬盘', 'RAM（随机存取存储器）', 'U 盘', '光驱'], answer: 'B', analysis: '内存一般指 RAM，断电后数据丢失；硬盘、U 盘属于外存。' },
  { type: 'multiple', stem: '下列属于编程语言的有？', options: ['Python', 'Java', 'C++', 'Photoshop'], answer: 'ABC', analysis: 'Photoshop 是图像处理软件，不是编程语言。' },
  { type: 'single', stem: '一张 1024×768 像素、24 位色的位图，未压缩时数据量约为？', options: ['0.7 MB', '2.25 MB', '6 MB', '18 MB'], answer: 'B', analysis: '1024×768×3 字节 = 2359296 字节 ≈ 2.25 MB（24 位色 = 3 字节/像素）。' },
  { type: 'judge', stem: '在关系数据库中，主键的值可以重复。', answer: '错', analysis: '主键必须唯一且非空，用于唯一标识一条记录。' },
  { type: 'single', stem: 'SQL 中用于查询数据的关键字是？', options: ['SELECT', 'UPDATE', 'DELETE', 'INSERT'], answer: 'A', analysis: 'SELECT 查询、INSERT 插入、UPDATE 修改、DELETE 删除。' },
  { type: 'single', stem: '下列排序算法中，平均时间复杂度为 O(n log n) 且不稳定的是？', options: ['冒泡排序', '快速排序', '归并排序', '插入排序'], answer: 'B', analysis: '快排平均 O(n log n)、最坏 O(n²)，且不稳定；归并排序稳定。' },
  { type: 'multiple', stem: '关于 Git 的说法正确的有？', options: ['git commit 提交本地修改', 'git push 推送到远程仓库', 'git clone 克隆远程仓库', 'git status 用于合并分支'], answer: 'ABC', analysis: 'git status 用于查看工作区与暂存区状态，合并用 git merge。' },
  { type: 'judge', stem: 'CPU 中的缓存（Cache）读写速度比内存快。', answer: '对', analysis: '存储层次为 寄存器 > Cache > 内存 > 外存，越靠近 CPU 越快、容量越小。' },
  { type: 'single', stem: '下列图片格式中，支持透明通道且压缩无损的是？', options: ['JPG', 'BMP', 'PNG', '以上都不支持'], answer: 'C', analysis: 'PNG 采用无损压缩并支持 Alpha 透明通道；JPG 有损且不支持透明。' },
  { type: 'single', stem: '下列存储容量单位中最大的是？', options: ['MB', 'GB', 'TB', 'KB'], answer: 'C', analysis: '1 TB = 1024 GB = 1024² MB = 1024³ KB。' },
  { type: 'judge', stem: '使用公共 Wi-Fi 时，访问 HTTPS 网站能降低数据被窃听的风险。', answer: '对', analysis: 'HTTPS 对传输内容加密，中间人无法直接读取明文，但仍需注意钓鱼网站与证书告警。' },

  const opts = idx.map((src, i) => { map[q.options[src].key] = LET[i]; return { key: LET[i], text: q.options[src].text }; });
  return Object.assign({}, q, { options: opts, answer: q.answer.map(a => map[a]).filter(Boolean) });

function stopExamTimer() { if (examTimer) { clearInterval(examTimer); examTimer = null; } }

    const el = document.getElementById('exClock'); if (!el) return;

      el.textContent = '剩余 ' + fmtDur(left);

function examCompute() {
  let right = 0, pending = 0, answered = 0;
  const queue = (E && E.queue) || [];
  queue.forEach(x => {
    const k = qkey(x.bankId, x.q.id), q = x.q;
    if (q.type === 'fill') {
      const inputs = (E.text[k] || {}).fill || [];
      if (inputs.some(v => String(v || '').trim())) answered++;
      if (checkFill(q, inputs).every(r => r.ok)) right++;
    } else if (q.type === 'short') {

      if (sameSet(c, q.answer)) right++;

function examStart() {
  const s = scope(), total = s.items.length;

  const order = $('#exO').value, shuf = $('#exS').value;
  let list = s.items.slice();
  if (order === 'rand') shuffle(list);
  list = list.slice(0, n);
  E = {
    queue: list.map(x => ({ bankId: x.bankId, q: shuf === 'shuffle' ? shuffleOpts(x.q) : x.q })),
    idx: 0, ans: {}, text: {}, self: {}, submitted: false, startedAt: Date.now(),
    duration: mins * 60, endAt: mins > 0 ? Date.now() + mins * 60000 : 0, result: null
  };

function examSubmit(auto) {
  if (!E || E.submitted) return;
  const c0 = examCompute();
  const unanswered = c0.total - c0.answered;
  if (!auto && unanswered > 0 && !window.confirm('还有 ' + unanswered + ' 道题未作答，确定要交卷吗？')) return;
  stopExamTimer();
  E.used = Math.round((Date.now() - E.startedAt) / 1000);
  E.queue.forEach(x => {
    const k = qkey(x.bankId, x.q.id), q = x.q;
    if (q.type === 'short') return;
    if (q.type === 'fill') {
      const inputs = (E.text[k] || {}).fill || [];
      if (inputs.some(v => String(v || '').trim())) recordAnswer(x.bankId, q, [], { inputs: inputs, myText: userTextOf(q, [], inputs) });
    } else {
      const c = E.ans[k] || [];
      if (c.length) recordAnswer(x.bankId, q, c);
    }
  });
  E.submitted = true;
  renderView(); window.scrollTo({ top: 0 });
}
function examChoose(key) {
  if (!E || E.submitted) return;
  const x = E.queue[E.idx], q = x.q, k = qkey(x.bankId, x.q.id);
  if (q.type === 'fill' || q.type === 'short') return;
  let chosen = (E.ans[k] || []).slice();
  if (q.type === 'multiple') chosen = chosen.indexOf(key) >= 0 ? chosen.filter(c => c !== key) : chosen.concat([key]);

}
function examSelf(i, ok) {

function doParseImport() {
  const text = $('#impText').value;
  const defName = ($('#impName').value || '').trim() || ('我的题库 ' + new Date().toLocaleDateString('zh-CN'));
  let res;
  try { res = parseImport(text, defName); } catch (err) { toast('解析失败：' + (err && err.message ? err.message : err)); return; }
  if (!res.questions.length) { toast('没有解析到题目，请检查格式'); return; }
  pendingImport = { name: res.name || defName, questions: res.questions };
  showImportPreview();
}function confirmImport() {
  const p = pendingImport; if (!p) { toast('请先解析题库'); return; }
  const mode = $('#impMode') ? $('#impMode').value : 'new';
  if (mode === 'new' || !S.banks.length) {
    const id = uid();
    S.banks.push({ id: id, name: p.name, questions: p.questions });
    scopeId = id;
  } else {
    const b = S.banks.find(x => x.id === $('#impTarget').value);
    if (!b) { toast('请选择目标题库'); return; }
    if (mode === 'replace') b.questions = p.questions;
    else {
      const exist = new Set(b.questions.map(q => q.id));
      let n = 0;
      p.questions.forEach(q => { let id = q.id; while (exist.has(id)) { n++; id = q.id + '_' + n; } exist.add(id); q.id = id; b.questions.push(q); });
    }
    scopeId = b.id;
  }
  pendingImport = null;
  save(); closeModal();
  view = 'practice'; P.filter = 'all'; buildQueue(); render(); window.scrollTo({ top: 0 });
  toast('导入成功，共 ' + p.questions.length + ' 题');
}
function exportBank(b) { download(b.name.replace(/[\\\/:*?"<>|]/g, '_') + '.json', JSON.stringify({ name: b.name, questions: b.questions }, null, 2)); }
function exportAll() {
  download('刷题题库-' + todayKey() + '.json', JSON.stringify({ app: '刷题软件', type: 'banks', exportedAt: new Date().toISOString(), banks: S.banks }, null, 2));
}
function exportBackup() {
  download('刷题备份-' + todayKey() + '.json', JSON.stringify({ app: '刷题软件', type: 'backup', version: 1, exportedAt: new Date().toISOString(), banks: S.banks, records: S.records, favs: S.favs, stats: S.stats }, null, 2));
}
function pickFile(accept, cb) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = accept;
  inp.onchange = async () => { const f = inp.files && inp.files[0]; if (!f) return; cb(await readTextSmart(f), f.name); };
  inp.click();
}
function importBackup(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { toast('文件不是合法的 JSON'); return; }
  if (!d || (!d.banks && !d.records)) { toast('这不像是本软件的备份文件'); return; }
  if (!window.confirm('导入备份会覆盖当前的题库与做题记录，确定继续吗？')) return;
  if (Array.isArray(d.banks)) S.banks = d.banks;
  if (d.records) S.records = d.records;
  if (d.favs) S.favs = d.favs;
  if (d.stats) S.stats = d.stats;
  scopeId = '__all'; save(); view = 'stats'; render(); toast('备份已恢复');
}

/* ==================== 交互 ==================== */
function doAct(act, el) {
  switch (act) {
    case 'close': closeModal(); return;
    case 'pf-all': P.filter = 'all'; buildQueue(); renderView(); return;
    case 'pf-new': P.filter = 'new'; buildQueue(); renderView(); return;
    case 'view-banks': goto('banks'); return;
    case 'view-practice': goto('practice'); return;
    case 'prev': practicePrev(); return;
    case 'next': practiceNext(); return;
    case 'submit': practiceSubmit(); return;
    case 'redo': practiceRedo(); return;
    case 'card': showCard(); return;
    case 'fav': toggleFav(); return;
    case 'reveal-short': practiceReveal(); return;
    case 'self-ok': practiceSelf(true); return;
    case 'self-bad': practiceSelf(false); return;
    case 'ex-self': examSelf(parseInt(el.dataset.idx, 10), el.dataset.ok === '1'); return;
    case 'practice-wrong': P.filter = 'wrong'; buildQueue(); stopExamTimer(); E = null; view = 'practice'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); if (!P.queue.length) toast('错题本是空的，加油！'); return;
    case 'practice-fav': P.filter = 'fav'; buildQueue(); stopExamTimer(); E = null; view = 'practice'; render(); if (!P.queue.length) toast('还没有收藏的题目'); return;
    case 'clear-wrong': if (window.confirm('清空错题本？（做题记录和统计会保留）')) { Object.keys(S.records).forEach(k => S.records[k].lastCorrect = true); save(); renderView(); toast('错题本已清空'); } return;
    case 'wrong-detail': { const r = wrongList()[parseInt(el.dataset.idx, 10)]; if (r) showRecordDetail(r); return; }
    case 'detail-q': { const x = favList()[parseInt(el.dataset.idx, 10)]; if (x) showDetail(x.q); return; }
    case 'unfav': { const x = favList()[parseInt(el.dataset.idx, 10)]; if (x) { delete S.favs[qkey(x.bankId, x.q.id)]; save(); renderView(); toast('已取消收藏'); } return; }
    case 'exam-start': examStart(); return;
    case 'exam-submit': examSubmit(false); return;
    case 'exam-prev': if (E && E.idx > 0) { E.idx--; renderView(); window.scrollTo({ top: 0, behavior: 'smooth' }); } return;
    case 'exam-next': if (E && E.idx < E.queue.length - 1) { E.idx++; renderView(); window.scrollTo({ top: 0, behavior: 'smooth' }); } return;
    case 'exam-card': showCard(); return;
    case 'exam-quit': if (window.confirm('退出考试？本次作答不会计分。')) { stopExamTimer(); E = null; renderView(); } return;
    case 'exam-again': stopExamTimer(); E = null; renderView(); return;
    case 'exam-reset': stopExamTimer(); E = null; renderView(); return;
    case 'exp-all': exportBackup(); toast('备份已下载'); return;
    case 'imp-all': pickFile('.json', importBackup); return;
    case 'reset-records': if (window.confirm('清空所有做题记录、错题本与统计数据？（题库保留）')) { S.records = {}; S.favs = {}; S.stats = { answered: 0, correct: 0, days: {} }; save(); buildQueue(); renderView(); toast('记录已清空'); } return;
    case 'reset-all': if (window.confirm('将删除所有题库与进度，恢复到初始状态，确定吗？') && window.confirm('再次确认：此操作不可撤销。')) { try { localStorage.removeItem(LS_KEY); } catch (e) { } location.reload(); } return;
    case 'bk-new': { const n = window.prompt('新题库名称', '我的题库'); if (n === null) return; const id = uid(); S.banks.push({ id: id, name: (n || '').trim() || '我的题库', questions: [] }); scopeId = id; save(); render(); toast('已创建空题库，可以去“导入题库”填充题目'); return; }
    case 'bk-restore-builtin': if (!S.banks.some(b => b.id === 'builtin')) { S.banks.unshift(builtinBank()); save(); render(); toast('示例题库已恢复'); } return;
    case 'bk-use': scopeId = el.dataset.id; buildQueue(); render(); toast('已切换题库范围'); return;
    case 'bk-export-all': exportAll(); return;
    case 'bk-export-one': { const b = S.banks.find(x => x.id === el.dataset.id); if (b) exportBank(b); return; }
    case 'bk-rename': { const b = S.banks.find(x => x.id === el.dataset.id); if (!b) return; const n = window.prompt('重命名题库', b.name); if (n === null) return; b.name = (n || '').trim() || b.name; save(); render(); return; }
    case 'bk-del': { const b = S.banks.find(x => x.id === el.dataset.id); if (!b) return; if (!window.confirm('删除题库「' + b.name + '」？其中的题目和记录都会一起删除。')) return; S.banks = S.banks.filter(x => x.id !== b.id); b.questions.forEach(q => delete S.records[qkey(b.id, q.id)]); if (scopeId === b.id) scopeId = '__all'; save(); buildQueue(); render(); toast('题库已删除'); return; }
    case 'bk-parse': doParseImport(); return;
    case 'bk-confirm': confirmImport(); return;
    case 'bk-template': download('题库模板.csv', '\uFEFF' + ['题目,选项A,选项B,选项C,选项D,答案,解析,题型', '下列哪个是操作系统？,Windows,MySQL,Photoshop,Excel,A,Windows 是操作系统,单选', '下列属于编程语言的有？,Python,Java,C++,,ABC,,多选', 'TCP 是面向连接的协议。,,,,,正确,,判断'].join('\r\n'), 'text/csv;charset=utf-8'); return;
    case 'bk-template-txt': download('题库模板.txt', '1. 下列哪个是操作系统？\nA. Windows\nB. MySQL\nC. Photoshop\nD. Excel\n答案：A\n解析：Windows 是操作系统。\n\n2. 下列属于编程语言的有？\nA. Python\nB. Java\nC. C++\n答案：ABC\n\n3. TCP 是面向连接的协议。\n答案：对\n', 'text/plain;charset=utf-8'); return;
    default: return;
  }
}
function jumpTo(i) {
  if (view === 'exam' && E && !E.submitted) { E.idx = i; } else { P.idx = i; }
  closeModal(); renderView(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-opt],[data-act],[data-filter],[data-order],[data-view],[data-cj]');
  if (!el) return;
  if (el.dataset.view) {
    const target = el.dataset.view;
    if (E && !E.submitted && target !== 'exam' && !window.confirm('考试还没有交卷，离开将放弃本次考试，确定吗？')) return;
    if (target !== 'exam') { E = null; stopExamTimer(); }
    goto(target); return;
  }
  if (el.dataset.cj != null) { jumpTo(parseInt(el.dataset.cj, 10)); return; }
  if (el.dataset.filter) { P.filter = el.dataset.filter; buildQueue(); renderView(); return; }
  if (el.dataset.order) { P.order = el.dataset.order; buildQueue(); renderView(); return; }
  if (el.dataset.opt) { if (view === 'exam') examChoose(el.dataset.opt); else practiceChoose(el.dataset.opt); return; }
  if (el.dataset.act) { doAct(el.dataset.act, el); return; }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (!el || !el.dataset || (el.dataset.fill == null && el.dataset.short == null)) return;
  if (view === 'exam' && E && !E.submitted) {
    const x = E.queue[E.idx]; if (!x) return;
    const kk = qkey(x.bankId, x.q.id);
    const tt = E.text[kk] || (E.text[kk] = { fill: [], short: '' });
    if (el.dataset.fill != null) tt.fill[parseInt(el.dataset.fill, 10)] = el.value; else tt.short = el.value;
  } else if (view === 'practice') {
    const x = P.queue[P.idx]; if (!x) return;
    const kk = qkey(x.bankId, x.q.id);
    const tt = P.text[kk] || (P.text[kk] = { fill: [], short: '' });
    if (el.dataset.fill != null) tt.fill[parseInt(el.dataset.fill, 10)] = el.value; else tt.short = el.value;
  }
});
document.addEventListener('dragover', e => { e.preventDefault(); });
document.addEventListener('drop', e => {
  if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
  e.preventDefault();
  handleImportFile(e.dataTransfer.files[0]);
});
document.addEventListener('change', e => {
  if (e.target.id === 'impMode') { const t = $('#impTarget'); if (t) t.style.display = e.target.value === 'new' ? 'none' : ''; }
  if (e.target.id === 'impFile') {
    const f = e.target.files && e.target.files[0];
    if (f) handleImportFile(f);
  }
});
document.addEventListener('keydown', e => {
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) {
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.fill != null) {
      e.preventDefault();
      if (view === 'exam' && E && !E.submitted) doAct('exam-next'); else practiceSubmit();
    }
    return;
  }
  if ($('#overlay').classList.contains('on')) { if (e.key === 'Escape') closeModal(); return; }
  const letter = /^[a-jA-J]$/.test(e.key) ? e.key.toUpperCase() : null;
  if (view === 'exam' && E && !E.submitted) {
    const x = E.queue[E.idx];
    if (letter) { examChoose(letter); e.preventDefault(); return; }
    if (/^[1-9]$/.test(e.key)) { const o = x.q.options[parseInt(e.key, 10) - 1]; if (o) examChoose(o.key); e.preventDefault(); return; }
    if (e.key === 'ArrowLeft') { doAct('exam-prev'); e.preventDefault(); return; }
    if (e.key === 'ArrowRight' || e.key === 'Enter') { doAct('exam-next'); e.preventDefault(); return; }
    return;
  }
  if (view !== 'practice' || !P.queue.length) return;
  const x = P.queue[P.idx]; if (!x) return;
  const k = qkey(x.bankId, x.q.id);
  if (letter) { practiceChoose(letter); e.preventDefault(); return; }
  if (/^[1-9]$/.test(e.key)) { const o = x.q.options[parseInt(e.key, 10) - 1]; if (o) practiceChoose(o.key); e.preventDefault(); return; }
  if (e.key === 'Enter') { if (P.submitted[k]) practiceNext(); else practiceSubmit(); e.preventDefault(); return; }
  if (e.key === 'ArrowLeft') { practicePrev(); e.preventDefault(); return; }
  if (e.key === 'ArrowRight') { practiceNext(); e.preventDefault(); return; }
});
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
$('#btnTheme').addEventListener('click', () => { S.ui.theme = (S.ui.theme === 'dark') ? 'light' : 'dark'; applyTheme(); save(); });
$('#scope').addEventListener('change', e => { scopeId = e.target.value; buildQueue(); renderView(); });

/* ==================== 启动 ==================== */
function applyTheme() { document.documentElement.setAttribute('data-theme', S.ui.theme || 'dark'); }
load();
applyTheme();
buildQueue();
render();
console.log('刷题软件已就绪：', allCount(), '道题目');

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { }); });
}
